name: Build multiplataforma

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows - Setup e Portable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Gerar Windows
        run: npm run dist:win

      - name: Salvar artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: Clinica-da-Dor-PCS-Windows
          path: |
            release/*Setup*.exe
            release/*Portable*.exe
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux - AppImage e DEB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Gerar Linux
        run: npm run dist:linux

      - name: Salvar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: Clinica-da-Dor-PCS-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS - DMG e ZIP universal
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Gerar macOS
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Salvar artefatos macOS
        uses: actions/upload-artifact@v4
        with:
          name: Clinica-da-Dor-PCS-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30
